    <h1>Navigation Bar</h1>

    <p>A navigation bar helps users move between different pages of a website.</p>
    <p>It usually contains links such as Home, About, Contact, and Services.</p>
    <p>These links make it easy for users to find the information they need.</p>
    <p>A navigation bar is commonly placed at the top of a webpage.</p>
